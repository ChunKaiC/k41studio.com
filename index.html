<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K41 Studio</title>
  <meta name="description" content="k41studio.com is under construction.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #ededed;
        --muted: #9a9a9a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>K41 Studio</h1>
    <p>Under construction. Check back soon.</p>
  </main>
</body>
</html>
